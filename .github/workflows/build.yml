name: Generate Gallery

on:
  push:
    branches:
      - main
    paths:
      - "host/**"
      - ".github/workflows/build-gallery.yml"

permissions:
  contents: write

jobs:
  build-gallery:
    if: "!contains(github.event.head_commit.message, 'Update generated gallery')"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate gallery
        run: |
          cd host
          node index.js

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update generated gallery"